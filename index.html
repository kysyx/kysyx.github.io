<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>

    <style>
        body {
            margin: 0;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: #f2f2f2;
            /* color: #333; */
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-top: 10px;
            color: #ccc;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .photo {
            display: block;
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 30px;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .bio-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .bio-box h2 {
            margin-top: 0;
            color: #222;
        }

        .bio-box p {
            line-height: 1.7;
        }

        .video {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .video   h2 {
            margin-top: 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* Mobile
        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            .profile-photo {
                width: 140px;
                height: 140px;
            } */
        /* } */
    </style>
</head>

<body>

    <header>
        <h1>Welcome!</h1>
    </header>

    <main class="container">

        <img src="cat.jpg" class="photo">

        <section class="bio-box">
            <h2>About Me</h2>

            <p>
                Hello! My name is Sam Yong Xuan. I am a student from SMU and taking Bachelor of Science (Information Systems) degree.   
            </p>

        </section>

        <section class="video">
            <h2>One Week In Japan</h2>

            <div class="video-container">
                <iframe
                    src="https://www.youtube.com/embed/yXzbdP6viHo?autoplay=1&mute=1"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Sam Yong Xuan</p>
    </footer>

</body>
</html>
